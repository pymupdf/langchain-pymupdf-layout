[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-pymupdf-layout"
version = "1.1.0"
description = "An integration package connecting PyMuPDF Layout to LangChain. Load PDF content using AI-based, CPU only, layout analysis."
readme = "README.md"
authors = [{name = "Jamie Lemon", email = "jamie.lemon@artifex.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.11"

dependencies = [
    "langchain>=1.5.2",
    "pymupdf>=2.1"
]

[project.optional-dependencies]
examples = [
    "langchain-text-splitters>=1.0"
]
